syntax = "proto3";

package quiz.v1;

option go_package = "github.com/Talan-Application/proto-generation/gen/quiz/v1;quizv1";

service QuizService {
  rpc CreateQuiz(CreateQuizRequest)       returns (QuizResponse);
  rpc GetQuiz(GetQuizRequest)             returns (QuizResponse);
  rpc GetAllQuizzes(GetAllQuizzesRequest) returns (GetAllQuizzesResponse);
  rpc GetMyQuizzes(GetMyQuizzesRequest)   returns (GetAllQuizzesResponse);
  rpc PublishQuiz(PublishQuizRequest)     returns (PublishQuizResponse);
  rpc UpdateQuiz(UpdateQuizRequest)       returns (QuizResponse);
  rpc DeleteQuiz(DeleteQuizRequest)       returns (DeleteQuizResponse);
}

service QuestionService {
  rpc CreateQuestion(CreateQuestionRequest)       returns (QuestionResponse);
  rpc GetQuestion(GetQuestionRequest)             returns (QuestionResponse);
  rpc GetAllQuestions(GetAllQuestionsRequest)     returns (GetAllQuestionsResponse);
  rpc UpdateQuestion(UpdateQuestionRequest)       returns (QuestionResponse);
  rpc DeleteQuestion(DeleteQuestionRequest)       returns (DeleteQuestionResponse);
}

service AnswerService {
  rpc CreateAnswer(CreateAnswerRequest)       returns (AnswerResponse);
  rpc GetAnswer(GetAnswerRequest)             returns (AnswerResponse);
  rpc GetAllAnswers(GetAllAnswersRequest)     returns (GetAllAnswersResponse);
  rpc UpdateAnswer(UpdateAnswerRequest)       returns (AnswerResponse);
  rpc DeleteAnswer(DeleteAnswerRequest)       returns (DeleteAnswerResponse);
}

service QuizResultService {
  rpc SubmitQuiz(SubmitQuizRequest)           returns (SubmitQuizResponse);
  rpc GetQuizResults(GetQuizResultsRequest)   returns (GetQuizResultsResponse);
}

message CreateQuizRequest {
  string title      = 1;
  string language   = 2;
  string type       = 3;
  int64  common_subject_id = 4;
}

message UpdateQuizRequest {
  int64  id       = 1;
  string title    = 2;
  string language = 3;
  string type     = 4;
}

message GetQuizRequest {
  int64 id = 1;
}

message GetAllQuizzesRequest {
  optional int32  limit  = 1;
  optional int32  offset = 2;
  optional string status = 3;
}

message GetMyQuizzesRequest {
  optional int32 limit  = 1;
  optional int32 offset = 2;
}

message PublishQuizRequest {
  int64 id = 1;
}

message DeleteQuizRequest {
  int64 id = 1;
}

message QuizResponse {
  int64  id         = 1;
  string title      = 2;
  string language   = 3;
  int64  author_id  = 4;
  string status     = 5;
  string type       = 6;
  int64  common_subject_id = 7;
  int64  created_at = 8;
  int64  updated_at = 9;
}

message GetAllQuizzesResponse {
  repeated QuizResponse quizzes = 1;
}

message DeleteQuizResponse {
  string message = 1;
}

message PublishQuizResponse {}

message CreateQuestionRequest {
  int64  quiz_id          = 1;
  string text             = 2;
  string context          = 3;
  string video_answer_url = 4;
  int64  order            = 5;
}

message UpdateQuestionRequest {
  int64  id               = 1;
  string text             = 2;
  string context          = 3;
  string video_answer_url = 4;
  int64  order            = 5;
}

message GetQuestionRequest {
  int64 id = 1;
}

message GetAllQuestionsRequest {
  int64          quiz_id = 1;
  optional int32 limit   = 2;
  optional int32 offset  = 3;
}

message DeleteQuestionRequest {
  int64 id = 1;
}

message QuestionResponse {
  int64  id               = 1;
  int64  quiz_id          = 2;
  string text             = 3;
  string context          = 4;
  string video_answer_url = 5;
  int64  order            = 6;
  int64  created_at       = 7;
  int64  updated_at       = 8;
}

message GetAllQuestionsResponse {
  repeated QuestionResponse questions = 1;
}

message DeleteQuestionResponse {
  string message = 1;
}

// Answer messages
message CreateAnswerRequest {
  int64  question_id = 1;
  string text        = 2;
  bool   correct     = 3;
}

message UpdateAnswerRequest {
  int64  id      = 1;
  string text    = 2;
  bool   correct = 3;
}

message GetAnswerRequest {
  int64 id = 1;
}

message GetAllAnswersRequest {
  int64          question_id = 1;
  optional int32 limit       = 2;
  optional int32 offset      = 3;
}

message DeleteAnswerRequest {
  int64 id = 1;
}

message AnswerResponse {
  int64  id          = 1;
  int64  question_id = 2;
  string text        = 3;
  bool   correct     = 4;
  int64  created_at  = 5;
  int64  updated_at  = 6;
}

message GetAllAnswersResponse {
  repeated AnswerResponse answers = 1;
}

message DeleteAnswerResponse {
  string message = 1;
}

message AnswerSubmission {
  int64 question_id = 1;
  int64 answer_id   = 2;
}

message SubmitQuizRequest {
  int64                    quiz_id = 1;
  repeated AnswerSubmission answers = 2;
}

message QuestionResult {
  int64 question_id        = 1;
  int64 selected_answer_id = 2;
  int64 correct_answer_id  = 3;
  bool  is_correct         = 4;
}

message SubmitQuizResponse {
  int64                   result_id       = 1;
  int32                   total_questions = 2;
  int32                   correct_answers = 3;
  double                  score           = 4;
  repeated QuestionResult results         = 5;
}

message GetQuizResultsRequest {
  int64 quiz_id = 1;
  int64 user_id = 2;
}

message QuizResultSummary {
  int64  id              = 1;
  int64  quiz_id         = 2;
  int64  user_id         = 3;
  double score           = 4;
  int32  total_questions = 5;
  int32  correct_answers = 6;
  int64  submitted_at    = 7;
}

message GetQuizResultsResponse {
  repeated QuizResultSummary results = 1;
}
