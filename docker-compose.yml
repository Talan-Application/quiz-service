services:
    # ── postgres ───────────────────────────────────────────────────────────────
    postgres:
        image: postgres:18.1-bookworm
        environment:
            POSTGRES_USER: ${DATABASE_USER:-postgres}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
            POSTGRES_DB: ${DATABASE_DBNAME:-quiz_db}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
            interval: 5s
            timeout: 5s
            retries: 5
        ports:
            - "${DATABASE_PORT:-5434}:5432"
        networks:
            - quiz-network

    # ── quiz-service migration ──────────────────────────────────────────────────────────
    quiz-migration:
        image: migrate/migrate:v4.19.1
        volumes:
            - ${PROJECT_ROOT:-./}/migrations:/migrations
        command: ["-path", "/migrations", "-database", "postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_DBNAME:-quiz_db}?sslmode=${DATABASE_SSLMODE:-disable}", "up"]
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - quiz-network

    # ── quiz-service ──────────────────────────────────────────────────────────
    quiz-service:
        build: .
        ports:
            - "${GRPC_PORT:-50052}:${GRPC_PORT:-50052}"
        environment:
            APP_ENV: ${APP_ENV:-production}
            DATABASE_HOST: postgres
            DATABASE_PORT: 5432
            DATABASE_USER: ${DATABASE_USER:-postgres}
            DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
            DATABASE_DBNAME: ${DATABASE_DBNAME:-quiz_db}
            DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
            GRPC_PORT: ${GRPC_PORT:-50052}
            JWT_SECRETKEY: ${JWT_SECRETKEY:-change-me-in-production}
        depends_on:
            postgres:
                condition: service_healthy
            quiz-migration:
                condition: service_completed_successfully
        restart: unless-stopped
        networks:
            - quiz-network

networks:
    quiz-network:
        driver: bridge

volumes:
    postgres_data:
